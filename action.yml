name: 'Catalog Dependency Updater'
description: 'Automated dependency updates for catalog: protocol monorepos (Bun, pnpm, Yarn). Replaces Dependabot for catalog-based workspaces.'

inputs:
  config:
    description: 'Path to .catalog-updaterc.json config file (relative to each discovered directory)'
    default: '.catalog-updaterc.json'
  dry-run:
    description: 'Preview updates without creating PRs'
    default: 'false'
  token:
    description: 'GitHub token for creating PRs. Defaults to github.token. Use a PAT or GitHub App token to trigger downstream workflows.'
    default: ''
  exclude-directories:
    description: 'Comma-separated directories to exclude from catalog discovery (supports glob patterns)'
    default: ''
  bun-version:
    description: 'Bun version used to resolve and install dependencies. Match your project''s Bun version — Bun 1.4+ writes a lockfile format unreadable by Bun <= 1.3.'
    default: '1.4.2'

branding:
  icon: 'package'
  color: 'orange'

runs:
  using: 'composite'
  steps:
    - name: Configure git identity
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    # The action runs from source, so its own dependencies must be installed
    # before main.ts can import effect/@effect/platform-bun/yaml. Without this,
    # Bun falls back to auto-install, which resolves the `latest` dist-tag —
    # wrong versions for rc-pinned deps. Runtime deps only (--production),
    # lockfile is committed (--frozen-lockfile), and scripts are skipped
    # (--ignore-scripts) so `prepare` cannot touch git config on the runner.
    - name: Install action dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile --production --ignore-scripts

    - name: Run catalog updater
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        CATALOG_UPDATE_EXCLUDE: ${{ inputs.exclude-directories }}
      run: bun ${{ github.action_path }}/src/main.ts --config "${{ inputs.config }}" ${{ inputs.dry-run == 'true' && '--dry-run' || '' }}
